[package]
name = "pulsefeed"
version = "0.1.0"
edition = "2021"
description = "Optional async quote feed for PortfolioPulse: polls the market-data provider, recomputes every user's unrealized P&L with SIMD, streams updates over WebSocket, and mirrors ticks into ClickHouse."

[dependencies]
# Async runtime and networking.
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Several crates enable different rustls backends; pin one explicitly or
# rustls panics on the first TLS handshake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Serialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebSocket token verification (HMAC-SHA256 shared with the app).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# CLI / config / logging.
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = "fat"
codegen-units = 1
